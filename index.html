<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evolution Garage - DHL x Formula E</title>
  </head>
  <body>
    <!-- Fundo de partículas em tela cheia -->
    <canvas id="bg-particles"></canvas>

    <div id="ui-container">
      <!-- Barra Superior com o logótipo oficial PNG -->
      <header class="top-bar">
        <div class="logo-box">
          <img 
            src="/src/assets/dhl x formula e logo.png" 
            alt="DHL x Formula E Official Founding & Logistics Partner" 
            class="dhl-logo-img"
          />
        </div>
        <div class="dot-matrix"></div>
      </header>

      <!-- VIEW 1: MODO SELEÇÃO INDIVIDUAL -->
      <section id="single-view" class="view-mode active">
        <!-- Seletor no topo para versão mobile -->
        <div class="mobile-selector-top">
          <div id="vehicle-tabs-mobile" class="vehicle-tabs"></div>
          <button id="btn-toggle-compare-mobile" class="btn-compare-action interactive">
            Add to compare
          </button>
        </div>

        <div class="showcase-area">
          <div class="view-frame" id="canvas-host-single">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>

            <div class="view-meta">
              <span id="car-season" class="season-tag">SEASON 13, IN SERVICE FROM 2026/27</span>
              <h1 id="car-title">GEN4</h1>
              
              <!-- Botão desktop posicionado abaixo do título -->
              <button id="btn-toggle-compare-desktop" class="btn-compare-action desktop-compare-btn interactive">
                Add to compare
              </button>
            </div>

            <!-- Canvas Three.js confinado dentro do frame -->
            <canvas id="webgl"></canvas>

            <button id="btn-prev" class="nav-arrow left interactive">&lt;</button>
            <button id="btn-next" class="nav-arrow right interactive">&gt;</button>
          </div>

          <aside class="stats-panel interactive">
            <div class="stats-header">
              <span class="stats-title-bar">— STATS · <span id="stats-car-name">GEN4</span></span>
              <span id="stats-index" class="stats-counter">05 / 06</span>
            </div>
            <div id="specs-list" class="specs-list"></div>
          </aside>
        </div>

        <!-- Seletor na barra inferior para versão desktop -->
        <footer class="bottom-bar desktop-bottom-bar">
          <div class="selector-wrapper interactive">
            <div class="selector-header">
              <span>— SELECT VEHICLE</span>
              <span id="selector-index">05 / 06</span>
            </div>
            <div id="vehicle-tabs-desktop" class="vehicle-tabs"></div>
          </div>
        </footer>
      </section>

      <!-- VIEW 2: MODO COMPARAÇÃO DIRETA -->
      <section id="compare-view" class="view-mode">
        <div class="compare-viewport" id="canvas-host-compare">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>

          <!-- Metas Superiores Lado a Lado -->
          <div class="compare-top-info">
            <div class="compare-card-meta">
              <div class="meta-texts">
                <span id="cmp-cat-1" class="season-tag">SEASON 13 RACE CAR</span>
                <h2 id="cmp-title-1" class="cmp-title">GEN4</h2>
              </div>
              <button id="btn-swap-1" class="btn-swap interactive">Swap</button>
            </div>

            <div class="compare-card-meta right">
              <div class="meta-texts">
                <span id="cmp-cat-2" class="season-tag">DHL DELIVERY FLEET</span>
                <h2 id="cmp-title-2" class="cmp-title">Kia PV5 Cargo L2H1</h2>
              </div>
              <button id="btn-swap-2" class="btn-swap interactive">Swap</button>
            </div>
          </div>

          <!-- Botão central para alternar posições dos carros -->
          <button id="btn-switch-positions" class="btn-switch-positions interactive" title="Switch positions">
            <img src="/src/assets/SwitchPositionsIcon.svg" alt="Switch" class="icon-switch" />
          </button>

          <!-- Régua métrica de piso -->
          <div class="metric-scale">
            <div class="ruler-ticks">
              <span>|</span><span>|</span><span>|</span><span>|</span><span>|</span>
              <span>|</span><span>|</span><span>|</span><span>|</span><span>|</span>
            </div>
          </div>
        </div>

        <!-- Tabela Comparativa de Especificações -->
        <div class="compare-table-container interactive">
          <table class="compare-table">
            <thead>
              <tr>
                <th id="th-car-1" class="col-c1">GEN4</th>
                <th class="col-center">
                  <div class="toggle-mode-group">
                    <button id="tab-btn-attribute" class="toggle-btn">Attribute</button>
                    <button id="tab-btn-difference" class="toggle-btn active">Difference</button>
                  </div>
                </th>
                <th id="th-car-2" class="col-c2">KIA PV5 CARGO</th>
              </tr>
            </thead>
            <tbody id="compare-tbody"></tbody>
          </table>

          <!-- Ações em Mobile: Swap e Back to Garage agrupados -->
          <div class="compare-actions-bar">
            <div class="mobile-swap-bar">
              <button id="btn-swap-m1" class="btn-swap-mobile interactive">Swap</button>
              <button id="btn-swap-m2" class="btn-swap-mobile interactive">Swap</button>
            </div>
            <button id="btn-exit-compare" class="btn-exit-compare interactive">✕ Back to Garage</button>
          </div>
        </div>
      </section>

      <!-- Triângulo Amarelo de Fundo -->
      <div class="yellow-triangle"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
